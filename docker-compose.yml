# SQL Server for local development only. The password below is a throwaway local
# placeholder - never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      # The repository root, so the build can see Directory.Packages.props and global.json.
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supportdesk-api
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      # "sqlserver" is the service name: inside a container, localhost is the container itself.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "${Jwt__SigningKey:-local-dev-only-signing-key-not-a-secret-0123456789}"
      # An empty volume gets the schema and the demo data on the first start.
      Database__MigrateOnStartup: "true"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  supportdesk-sql:
